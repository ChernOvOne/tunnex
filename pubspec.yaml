name: tunnex
description: "Tunnex VPN — secure, fast, premium."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # URL launcher
  url_launcher: ^6.3.1

  # QR
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0

  # Deep links
  app_links: ^6.3.3

  # Crypto (for HWID)
  crypto: ^3.0.6

  # Device info (for HWID)
  device_info_plus: ^11.2.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1

  # Utils
  uuid: ^4.5.1
  collection: ^1.19.1
  qr: ^3.0.2
  system_tray: ^0.1.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#0D0D1A"
  adaptive_icon_foreground: "assets/icons/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
